name: Nodus Home CI & APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Type Check Gate (Nodus Home)
        run: npm --prefix packages/nodus-home run lint

      - name: Run Unit Test Suite (Nodus Home)
        run: npm --prefix packages/nodus-home run test

      - name: Build Web Application
        run: npm --prefix packages/nodus-home run build

      - name: Sync Frontend Assets to Android Shell
        run: npm --prefix packages/nodus-home run sync:assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle
        run: chmod +x packages/nodus-home/android-shell/gradlew

      - name: Build Android Debug APK
        run: |
          cd packages/nodus-home/android-shell
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodus-home-debug-apk
          path: packages/nodus-home/android-shell/app/build/outputs/apk/debug/app-debug.apk
