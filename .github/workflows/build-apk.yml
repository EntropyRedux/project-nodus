name: Build Android Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build frontend bundle
        run: |
          npm ci || npm install
          cd packages/nodus-home
          npm run build
          rm -rf android-shell/app/src/main/assets/frontend/*
          mkdir -p android-shell/app/src/main/assets/frontend
          cp -r dist/* android-shell/app/src/main/assets/frontend/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd packages/nodus-home/android-shell
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Nodus Home APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodusHome-debug.apk
          path: packages/nodus-home/android-shell/app/build/outputs/apk/debug/app-debug.apk
