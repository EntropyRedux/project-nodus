name: Nodus Home CI & APK Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Type Check Gate (Nodus Home)
        run: npm --prefix packages/nodus-home run lint

      - name: Run Unit Test Suite (Nodus Home)
        run: npm --prefix packages/nodus-home run test

      - name: Build Web Application
        run: npm --prefix packages/nodus-home run build

      - name: Sync Frontend Assets to Android Shell
        run: npm --prefix packages/nodus-home run sync:assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle
        run: chmod +x packages/nodus-home/android-shell/gradlew

      - name: Build Android Debug APK
        run: |
          cd packages/nodus-home/android-shell
          ./gradlew assembleDebug

      - name: Copy & Rename APK for Release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ]; then RELEASE_TAG="v1.3.0"; fi
          cp packages/nodus-home/android-shell/app/build/outputs/apk/debug/app-debug.apk "nodus-home-${RELEASE_TAG}-debug.apk"
          echo "RELEASE_APK=nodus-home-${RELEASE_TAG}-debug.apk" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodus-home-debug-apk
          path: ${{ env.RELEASE_APK }}

      - name: Create & Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          name: Nodus Home Release ${{ github.ref_name }}
          body: |
            ## Nodus Home ${{ github.ref_name }} Release
            
            ### Highlights:
            - **Continuous Scroll App Grid**: Repacks icons sequentially on Page 1 before spilling over.
            - **Smart Native Auto-Stash**: Automatically stashes the 3rd native floating window to the taskbar on dual-window capped OS environments (e.g., HyperOS).
            - **Google Calendar Sync Consent**: Explicit opt-in warning card explaining account data scope + instant Unsync control.
            - **Full Opacity Control**: System surface opacity slider range expanded from 0% to 100%.
            - **Lifecycle Poller Throttling**: Background timers auto-pause on `visibilitychange` to conserve battery.
            - **Type Safety & CI**: Zero `tsc --noEmit` lint errors with automated GitHub Actions quality gate.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
