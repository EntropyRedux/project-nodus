[package]
name = "nodus-desktop"
version = "0.1.0"
description = "Nodus Home Windows — Desktop HUD Companion with Hot-Corner Gestures"
authors = ["EntropyRedux"]
edition = "2021"

[lib]
name = "nodus_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "wry"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
tiny_http = "0.12"

# Windows-specific APIs for hot corners, process management, system control
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Shutdown",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
] }

[profile.dev]
incremental = true
opt-level = 1
debug = 0

[profile.release]
opt-level = 1
debug = 0
lto = "off"
codegen-units = 16
panic = "abort"


